[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tour2crypto-contracts"
version = "0.2.0"
description = "Tour2Crypto contract schemas, event definitions, and fixtures"
authors = [{name = "Tour2Crypto"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema",
  "pydantic",
  "faker",
  "pytest",
  "aiogram>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "httpx>=0.24",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://example.com/tour2crypto"

[tool.setuptools.packages.find]
include = [
  "t2c_contracts",
  "t2c_events",
  "t2c_logic",
  "t2c_rules",
  "t2c_pipeline",
  "t2c_bot",
  "t2c_api",
  "t2c_sync",
]

[tool.pytest.ini_options]
addopts = "-q"

[project.scripts]
tour2crypto-bot = "t2c_bot.app:main"
t2c-api = "t2c_api.app:main"
